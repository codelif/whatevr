syntax = "proto3";

package whatevr.v1;

option go_package = "whatevrd/internal/rpc/pb;pb";

enum DaemonState {
  DAEMON_STATE_UNSPECIFIED = 0;
  DAEMON_STATE_STARTING = 1;
  DAEMON_STATE_NEED_LOGIN = 2;
  DAEMON_STATE_CONNECTING = 3;
  DAEMON_STATE_ONLINE = 4;
  DAEMON_STATE_RECONNECTING = 5;
  DAEMON_STATE_OFFLINE = 6;
}

enum MessageDirection {
  MESSAGE_DIRECTION_UNSPECIFIED = 0;
  MESSAGE_DIRECTION_INCOMING = 1;
  MESSAGE_DIRECTION_OUTGOING = 2;
}

enum MessageStatus {
  MESSAGE_STATUS_UNSPECIFIED = 0;
  MESSAGE_STATUS_PENDING = 1;
  MESSAGE_STATUS_SENT = 2;
  MESSAGE_STATUS_DELIVERED = 3;
  MESSAGE_STATUS_READ = 4;
  MESSAGE_STATUS_FAILED = 5;
}

enum HistorySyncType {
  HISTORY_SYNC_TYPE_UNSPECIFIED = 0;
  HISTORY_SYNC_TYPE_INITIAL_BOOTSTRAP = 1;
  HISTORY_SYNC_TYPE_INITIAL_STATUS_V3 = 2;
  HISTORY_SYNC_TYPE_FULL = 3;
  HISTORY_SYNC_TYPE_RECENT = 4;
  HISTORY_SYNC_TYPE_PUSH_NAME = 5;
  HISTORY_SYNC_TYPE_NON_BLOCKING_DATA = 6;
  HISTORY_SYNC_TYPE_ON_DEMAND = 7;
  HISTORY_SYNC_TYPE_PROFILE_PICTURE = 8;
  HISTORY_SYNC_TYPE_OFFLINE_CATCHUP = 9;
}

enum HistorySyncPhase {
  HISTORY_SYNC_PHASE_UNSPECIFIED = 0;
  HISTORY_SYNC_PHASE_QUEUED = 1;
  HISTORY_SYNC_PHASE_DOWNLOADING = 2;
  HISTORY_SYNC_PHASE_PROCESSING = 3;
  HISTORY_SYNC_PHASE_COMPLETE = 4;
}

enum ContactAvailability {
  CONTACT_AVAILABILITY_UNSPECIFIED = 0;
  CONTACT_AVAILABILITY_ONLINE = 1;
  CONTACT_AVAILABILITY_OFFLINE = 2;
}

enum StickerSource {
  STICKER_SOURCE_UNSPECIFIED = 0;
  STICKER_SOURCE_RECENT = 1;
  STICKER_SOURCE_FAVORITE = 2;
  STICKER_SOURCE_ALL = 3;
}

enum AvatarSubjectKind {
  AVATAR_SUBJECT_KIND_UNSPECIFIED = 0;
  AVATAR_SUBJECT_KIND_CHAT = 1;
  AVATAR_SUBJECT_KIND_SENDER = 2;
}

service DaemonService {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc SubscribeEvents(SubscribeEventsRequest) returns (stream DaemonEvent);
  rpc Reconnect(ReconnectRequest) returns (ReconnectResponse);
}

service LoginService {
  rpc SubscribeLoginEvents(SubscribeLoginEventsRequest) returns (stream LoginEvent);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
}

service FrontendService {
  rpc HoldSession(HoldSessionRequest) returns (stream FrontendSessionEvent);
  rpc UpdateSessionState(UpdateSessionStateRequest) returns (UpdateSessionStateResponse);
}

service ChatService {
  rpc ListChats(ListChatsRequest) returns (ListChatsResponse);
  rpc GetMessages(GetMessagesRequest) returns (GetMessagesResponse);
  rpc MarkChatRead(MarkChatReadRequest) returns (MarkChatReadResponse);
  rpc SetChatPinned(SetChatPinnedRequest) returns (SetChatPinnedResponse);
  rpc SetChatPresence(SetChatPresenceRequest) returns (SetChatPresenceResponse);
  rpc SubscribeChatPresence(SubscribeChatPresenceRequest) returns (SubscribeChatPresenceResponse);
  rpc DownloadMessageMedia(DownloadMessageMediaRequest) returns (DownloadMessageMediaResponse);
  rpc GetMessageInfo(GetMessageInfoRequest) returns (GetMessageInfoResponse);
  rpc DeleteMessageForMe(DeleteMessageForMeRequest) returns (DeleteMessageForMeResponse);
}

service SendService {
  rpc SendText(SendTextRequest) returns (SendTextResponse);
  rpc SendMedia(SendMediaRequest) returns (SendMediaResponse);
  rpc RevokeMessage(RevokeMessageRequest) returns (RevokeMessageResponse);
  rpc ForwardMessage(ForwardMessageRequest) returns (ForwardMessageResponse);
  rpc SendReaction(SendReactionRequest) returns (SendReactionResponse);
}

service StickerService {
  rpc ListStickers(ListStickersRequest) returns (ListStickersResponse);
  rpc ListStickerPacks(ListStickerPacksRequest) returns (ListStickerPacksResponse);
  rpc GetStickerPack(GetStickerPackRequest) returns (GetStickerPackResponse);
  rpc DownloadSticker(DownloadStickerRequest) returns (DownloadStickerResponse);
  rpc SetStickerPackInstalled(SetStickerPackInstalledRequest) returns (SetStickerPackInstalledResponse);
  rpc SendSticker(SendStickerRequest) returns (SendStickerResponse);
  rpc SetStickerFavorite(SetStickerFavoriteRequest) returns (SetStickerFavoriteResponse);
}

message GetStatusRequest {}

message GetStatusResponse {
  DaemonState state = 1;
  string state_label = 2;
  string socket_path = 3;
  string data_dir = 4;
  string cache_dir = 5;
  string database_path = 6;
  string version = 7;
  string detail = 8;
  bool can_reconnect = 9;
  int32 retry_attempt = 10;
  int64 next_retry_unix = 11;
}

message SubscribeEventsRequest {}

message DaemonEvent {
  oneof payload {
    ConnectionChanged connection_changed = 1;
    LoginStateChanged login_state_changed = 2;
    NewMessage new_message = 3;
    MessageUpdated message_updated = 4;
    ChatUpdated chat_updated = 5;
    ChatPresenceChanged chat_presence_changed = 6;
    HistorySyncProgress history_sync_progress = 7;
    HistoryBackfilled history_backfilled = 8;
    MediaDownloadChanged media_download_changed = 9;
    AvatarUpdated avatar_updated = 10;
    StickerLibraryChanged sticker_library_changed = 11;
    StickerDownloadChanged sticker_download_changed = 12;
    MessageDeleted message_deleted = 13;
  }
}

// Published when a message was removed locally (delete for me). Revocations
// ("delete for everyone") keep the row and arrive as MessageUpdated with
// is_revoked set.
message MessageDeleted {
  string chat_id = 1;
  string message_id = 2;
}

// Published when the set of stickers in a source changed (recents reordered,
// favorites synced, packs installed/removed). Clients re-list the source if
// they are currently showing it.
message StickerLibraryChanged {
  StickerSource source = 1;
}

// Published when a sticker file finished downloading (or failed). Carries the
// full sticker so clients can patch a single row in place.
message StickerDownloadChanged {
  Sticker sticker = 1;
  string error_text = 2;
}

message Avatar {
  AvatarSubjectKind kind = 1;
  string id = 2;
  string local_path = 3;
  string status = 4;
  int64 updated_at_unix = 5;
  bool fetching = 6;
}

message AvatarUpdated {
  Avatar avatar = 1;
}

message HistorySyncProgress {
  HistorySyncType sync_type = 1;
  // 0..100, taken from waHistorySync.HistorySync.progress when present.
  uint32 progress_percent = 2;
  uint32 chunk_order = 3;
  uint32 conversations_in_chunk = 4;
  uint32 messages_in_chunk = 5;
  // True when this chunk completes the sync (progress >= 100, or sync type
  // does not carry progress).
  bool is_complete = 6;
  HistorySyncPhase phase = 7;
  uint32 processed_conversations = 8;
  uint32 processed_messages = 9;
}

message HistoryBackfilled {
  string chat_id = 1;
  uint32 messages_added = 2;
}

message ChatPresenceChanged {
  string chat_id = 1;
  string sender_id = 2;
  bool is_composing = 3;
  ContactAvailability availability = 4;
  int64 last_seen_unix = 5;
}

message MediaDownloadChanged {
  string message_id = 1;
  string chat_id = 2;
  bool downloading = 3;
  string error_text = 4;
}

message ConnectionChanged {
  DaemonState state = 1;
  string detail = 2;
  bool retrying = 3;
  int32 retry_attempt = 4;
  int64 next_retry_unix = 5;
  bool can_reconnect = 6;
  int32 pending_outgoing_count = 7;
}

message ReconnectRequest {}
message ReconnectResponse {}

message LoginStateChanged {
  DaemonState state = 1;
  string detail = 2;
}

message NewMessage {
  Message message = 1;
}

message MessageUpdated {
  Message message = 1;
}

message ChatUpdated {
  Chat chat = 1;
  string previous_chat_id = 2;
}

message SubscribeLoginEventsRequest {}

message LoginEvent {
  oneof payload {
    QrCode qr_code = 1;
    LoginStateChanged login_state_changed = 2;
  }
}

message QrCode {
  string code = 1;
  int64 expires_at_unix = 2;
}

message LogoutRequest {}

message LogoutResponse {}

message HoldSessionRequest {
  string client_name = 1;
  string session_id = 2;
}

message FrontendSessionEvent {
  string detail = 1;
  // Set when the daemon asks this frontend to surface a chat (e.g. the user
  // clicked a notification). The frontend should raise its window and open the
  // chat, switching if a different one is currently shown.
  OpenChat open_chat = 2;
}

message OpenChat {
  string chat_id = 1;
}

message UpdateSessionStateRequest {
  string session_id = 1;
  bool focused = 2;
  string active_chat_id = 3;
}

message UpdateSessionStateResponse {}

message ListChatsRequest {
  int32 limit = 1;
  // Deprecated: offset pagination degrades on large chat lists and skips or
  // repeats rows when the list reorders mid-pagination. Use after_chat_id.
  int32 offset = 2;
  // Keyset cursor: return chats strictly after this chat in list order
  // (pinned first, then most recent). Takes precedence over offset.
  string after_chat_id = 3;
}

message ListChatsResponse {
  repeated Chat chats = 1;
}

message GetMessagesRequest {
  string chat_id = 1;
  int32 limit = 2;
  // Same field numbers as the original flat fields, so this stays
  // wire-compatible with clients that set at most one of them.
  oneof anchor {
    string before_message_id = 3;
    string around_message_id = 4;
  }
}

message GetMessagesResponse {
  repeated Message messages = 1;
}

message MarkChatReadRequest {
  string chat_id = 1;
}

message MarkChatReadResponse {}

message SetChatPinnedRequest {
  string chat_id = 1;
  bool pinned = 2;
}

message SetChatPinnedResponse {}

message SetChatPresenceRequest {
  string chat_id = 1;
  bool composing = 2;
}

message SetChatPresenceResponse {}

message SubscribeChatPresenceRequest {
  string chat_id = 1;
}

message SubscribeChatPresenceResponse {}

message DownloadMessageMediaRequest {
  string message_id = 1;
}

message DownloadMessageMediaResponse {
  Message message = 1;
}

message GetMessageInfoRequest {
  string message_id = 1;
}

// One participant's receipt state for a message. Zero timestamps mean
// "not yet"; pending members appear with all timestamps zero.
message ParticipantReceipt {
  string jid = 1;
  string display_name = 2;
  string avatar_local_path = 3;
  int64 delivered_ts_unix = 4;
  int64 read_ts_unix = 5;
  int64 played_ts_unix = 6;
}

message GetMessageInfoResponse {
  MessageStatus status = 1;
  int64 sent_ts_unix = 2;
  // Aggregate times: for 1:1 the peer's receipt; for groups the time the
  // last member delivered/read (zero until everyone has).
  int64 delivered_ts_unix = 3;
  int64 read_ts_unix = 4;
  bool is_group = 5;
  // Group chats only: per-member receipt state, including members with no
  // receipt yet. Empty for 1:1 chats.
  repeated ParticipantReceipt receipts = 6;
}

message DeleteMessageForMeRequest {
  string message_id = 1;
}

message DeleteMessageForMeResponse {}

message RevokeMessageRequest {
  string message_id = 1;
}

message RevokeMessageResponse {
  Message message = 1;
}

message ForwardMessageRequest {
  string source_message_id = 1;
  repeated string target_chat_ids = 2;
}

message ForwardMessageResponse {
  repeated Message messages = 1;
}

message SendReactionRequest {
  string chat_id = 1;
  string message_id = 2;
  // The reaction emoji; an empty string removes our existing reaction.
  string emoji = 3;
}

message SendReactionResponse {
  // The reaction's target message, reloaded with its updated reaction set.
  Message message = 1;
}

message SetStickerFavoriteRequest {
  // Either the sticker's cache key or a sticker message id to resolve it from.
  string cache_key = 1;
  string message_id = 2;
  bool favorite = 3;
}

message SetStickerFavoriteResponse {
  Sticker sticker = 1;
}

message SendTextRequest {
  string chat_id = 1;
  string text = 2;
  string reply_to_message_id = 3;
}

message SendTextResponse {
  Message message = 1;
}

message SendMediaRequest {
  string chat_id = 1;
  string file_path = 2;
  string caption = 3;
  string reply_to_message_id = 4;
}

message SendMediaResponse {
  Message message = 1;
}

message Sticker {
  // Content hash identity: hex(FileSHA256), or "enc:"+hex(FileEncSHA256)
  // until the file has been downloaded once (app-state favorites do not
  // carry the plaintext hash).
  string cache_key = 1;
  // Display file: .webp, or the extracted Lottie .json for animated packs.
  // Empty until downloaded.
  string local_path = 2;
  string mime_type = 3;
  // True for Lottie stickers (rendered via RlottieSticker).
  bool is_animated = 4;
  int32 width = 5;
  int32 height = 6;
  repeated string emojis = 7;
  string accessibility_text = 8;
  string pack_id = 9;
  bool is_favorite = 10;
  int64 last_used_unix = 11;
  float weight = 12;
}

message StickerPack {
  string id = 1;
  string name = 2;
  string publisher = 3;
  string description = 4;
  bool animated = 5;
  bool lottie = 6;
  string tray_local_path = 7;
  int32 sticker_count = 8;
  bool installed = 9;
  bool contents_fetched = 10;
}

message ListStickersRequest {
  StickerSource source = 1;
  // Non-empty query searches across all sources (emoji tags, accessibility
  // text, pack names) and ignores source.
  string query = 2;
  int32 limit = 3;
}

message ListStickersResponse {
  repeated Sticker stickers = 1;
}

message ListStickerPacksRequest {
  bool force_refresh = 1;
}

message ListStickerPacksResponse {
  repeated StickerPack packs = 1;
}

message GetStickerPackRequest {
  string pack_id = 1;
}

message GetStickerPackResponse {
  StickerPack pack = 1;
  repeated Sticker stickers = 2;
}

message DownloadStickerRequest {
  string cache_key = 1;
}

message DownloadStickerResponse {
  Sticker sticker = 1;
}

message SetStickerPackInstalledRequest {
  string pack_id = 1;
  bool installed = 2;
}

message SetStickerPackInstalledResponse {
  StickerPack pack = 1;
}

message SendStickerRequest {
  string chat_id = 1;
  string cache_key = 2;
  string reply_to_message_id = 3;
}

message SendStickerResponse {
  Message message = 1;
}

message Chat {
  string id = 1;
  string name = 2;
  string last_message = 3;
  int64 last_message_time_unix = 4;
  int32 unread_count = 5;
  bool is_group = 6;
  string avatar_local_path = 7;
  MessageDirection last_message_direction = 8;
  MessageStatus last_message_status = 9;
  bool is_pinned = 10;
  uint32 pinned_order = 11;
  // Bumped on every change to this chat row; lets clients skip updates for
  // chats they already have at this stamp.
  int64 updated_at_unix = 12;
}

message Message {
  string id = 1;
  string chat_id = 2;
  string sender_id = 3;
  string text = 4;
  int64 timestamp_unix = 5;
  MessageDirection direction = 6;
  MessageStatus status = 7;
  string media_mime_type = 8;
  string media_local_path = 9;
  int32 media_width = 10;
  int32 media_height = 11;
  string media_thumbnail_local_path = 12;
  string sender_name = 13;
  string sender_avatar_local_path = 14;
  string media_kind = 15;
  bool media_animated = 16;
  MessageReply reply_to = 17;
  // Daemon-assigned monotonic insertion order (SQLite rowid). Used as the
  // tiebreaker within a single timestamp second so messages keep their true
  // arrival order; the random WhatsApp id carries no chronological meaning.
  int64 sort_seq = 18;
  // Sticker content hash; lets clients favorite a sticker straight from a
  // message without re-deriving the key.
  string media_cache_key = 19;
  // True when the message was deleted for everyone; content fields are
  // cleared and clients render a tombstone.
  bool is_revoked = 20;
  // Emoji reactions on this message, one per reactor (latest wins). Empty
  // when nobody has reacted.
  repeated Reaction reactions = 21;
}

message Reaction {
  string emoji = 1;
  string sender_id = 2;
  string sender_name = 3;
  int64 timestamp_unix = 4;
  // True when this reaction is our own (lets clients highlight and toggle it).
  bool from_me = 5;
}

message MessageReply {
  string message_id = 1;
  string sender_id = 2;
  string sender_name = 3;
  string text = 4;
  string media_kind = 5;
  string media_mime_type = 6;
  MessageDirection direction = 7;
}
