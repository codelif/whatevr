# Flatpak manifest for whatevr (daemon + Qt/Kirigami frontend).
#
# Flatpak bundles the KDE runtime, so this works on any distro regardless of
# the host's Qt/KF age — the main reason to ship it (e.g. Ubuntu LTS).
#
# GOTCHAS (this manifest is a tested-locally scaffold; iterate with
# flatpak-builder before publishing):
#   * Go 1.25 is required by whatsmeow. The org.freedesktop golang SDK
#     extension only provides 1.25 on the freedesktop 25.08 base, so the KDE
#     runtime is pinned to a version built on it (6.10+). Bump runtime-version
#     if the extension still ships an older Go.
#   * Flatpak builds are offline. The whatevrd module below uses a build-arg to
#     allow network for `go build`; for Flathub submission replace that with
#     vendored modules or a flatpak-builder-tools generated-sources file.
#   * rlottie and kirigami-addons are built as modules when absent from the
#     runtime.
id: in.codelif.Whatevr
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: whatevr-launcher.sh
finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: rlottie
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_SHARED_LIBS=ON
      - -DLOTTIE_MODULE=OFF
    sources:
      - type: git
        url: https://github.com/Samsung/rlottie.git
        tag: v0.2

  - name: kirigami-addons
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://invent.kde.org/libraries/kirigami-addons.git
        tag: v1.7.0

  - name: whatevr
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/golang/bin
      env:
        CGO_ENABLED: '1'
        GOFLAGS: -mod=mod
      # Offline-build escape hatch — remove for Flathub (vendor instead).
      build-args:
        - --share=network
    build-commands:
      # Builds + installs both binaries, the desktop/metainfo/icon and the
      # (sandbox-irrelevant) systemd unit. CGO go-sqlite3 uses its bundled
      # amalgamation, so no external sqlite is needed.
      - make install PREFIX=/app DESTDIR=/
      # Sandbox launcher (starts daemon + frontend together).
      - install -Dm755 packaging/flatpak/whatevr-launcher.sh /app/bin/whatevr-launcher.sh
    sources:
      - type: dir
        path: ../..
