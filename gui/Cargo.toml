[workspace]
resolver = "3"
members = ["crates/*", "whatgui", "tools/*"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "BSD-3-Clause"
repository = "https://github.com/codelif/whatevr"
authors = ["Harsh Sharma <harsh@codelif.in>"]

[workspace.dependencies]
what-core = { path = "crates/what-core" }
what-platform = { path = "crates/what-platform" }
what-render = { path = "crates/what-render" }
what-text = { path = "crates/what-text" }
what-ui = { path = "crates/what-ui" }
what-proto = { path = "crates/what-proto" }
what-media = { path = "crates/what-media" }

anyhow = { version = "1.0.104", default-features = false }
bytemuck = { version = "1.25.2", default-features = false }
clap = { version = "4.6.7", default-features = false }
etagere = { version = "0.3.0", default-features = false }
log = { version = "0.4.34", default-features = false }
png = { version = "0.18.1", default-features = false }
pollster = { version = "1.0.1", default-features = false }
raw-window-handle = { version = "0.6.2", default-features = false }
rustix = { version = "1.1.5", default-features = false }
thiserror = { version = "2.0.21", default-features = false }
wayland-backend = { version = "0.3.17", default-features = false }
wayland-client = { version = "0.31.15", default-features = false }
wayland-protocols = { version = "0.32.13", default-features = false }
wgpu = { version = "30.0.1", default-features = false }
xkbcommon = { version = "0.9.0", default-features = false }
