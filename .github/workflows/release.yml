name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release artifacts and AUR
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 90
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git openssh sudo base-devel go cmake ninja extra-cmake-modules zstd vulkan-headers \
            qt6-base qt6-declarative qt6-shadertools qt6-grpc \
            kcoreaddons kdbusaddons ki18n kirigami kirigami-addons prison sqlite \
            desktop-file-utils appstream libxml2
          useradd -m -G wheel builduser
          printf 'builduser ALL=(ALL) NOPASSWD: ALL\n' >> /etc/sudoers

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set rlottie cache key
        id: rlottie-cache-key
        run: printf 'week=%s\n' "$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore rlottie package
        uses: actions/cache@v5
        with:
          path: .cache/aur/rlottie
          key: arch-rlottie-${{ steps.rlottie-cache-key.outputs.week }}

      - name: Install rlottie
        run: |
          install -d "$GITHUB_WORKSPACE/.cache/aur/rlottie"
          shopt -s nullglob
          cached=("$GITHUB_WORKSPACE"/.cache/aur/rlottie/rlottie-*.pkg.tar*)
          if ((${#cached[@]})) && pacman -U --noconfirm "${cached[@]}"; then
            exit 0
          fi

          rm -f "$GITHUB_WORKSPACE"/.cache/aur/rlottie/rlottie-*.pkg.tar*
          rm -rf "$RUNNER_TEMP/rlottie"
          git clone https://aur.archlinux.org/rlottie.git "$RUNNER_TEMP/rlottie"
          chown -R builduser:builduser "$RUNNER_TEMP/rlottie"
          cd "$RUNNER_TEMP/rlottie"
          sudo -u builduser makepkg -s --noconfirm
          cp rlottie-*.pkg.tar* "$GITHUB_WORKSPACE/.cache/aur/rlottie/"
          pacman -U --noconfirm "$GITHUB_WORKSPACE"/.cache/aur/rlottie/rlottie-*.pkg.tar*

      - name: Validate metadata
        run: make validate

      - name: Build release artifacts
        run: make checksums PREFIX=/usr ARCH=x86_64

      - name: Write release notes from tag
        id: release-notes
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != tag ]; then
            printf 'release tag %s is not annotated\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi

          body="$(git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents:body)')"
          if [ -z "${body//[[:space:]]/}" ]; then
            printf 'release tag %s has no annotated body\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          printf '%s\n' "$body" > "$notes"
          printf 'path=%s\n' "$notes" >> "$GITHUB_OUTPUT"

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ steps.release-notes.outputs.path }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            build/whatevr-*.tar.gz
            build/whatevr-*.tar.zst
            build/SHA256SUMS

      - name: Render release AUR packages
        if: env.AUR_SSH_PRIVATE_KEY != ''
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SOURCE_SHA="$(awk '/\.tar\.gz$/ { print $1; exit }' build/SHA256SUMS)"
          BIN_SHA_X86_64="$(awk '/linux-x86_64\.tar\.zst$/ { print $1; exit }' build/SHA256SUMS)"
          python3 scripts/render_aur_release.py \
            --version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --bin-sha-x86_64 "$BIN_SHA_X86_64"

      - name: Configure AUR SSH
        if: env.AUR_SSH_PRIVATE_KEY != ''
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
          EOF

      - name: Push AUR packages
        if: env.AUR_SSH_PRIVATE_KEY != ''
        run: |
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          mkdir -p "$RUNNER_TEMP/aur"
          for pkg in whatevr whatevr-git whatevr-bin; do
            aur_dir="$RUNNER_TEMP/aur/$pkg"
            if ! git clone "ssh://aur@aur.archlinux.org/$pkg.git" "$aur_dir"; then
              mkdir -p "$aur_dir"
              git -C "$aur_dir" init
              git -C "$aur_dir" remote add origin "ssh://aur@aur.archlinux.org/$pkg.git"
            fi

            git -C "$aur_dir" checkout -B master
            cp "$GITHUB_WORKSPACE/packaging/aur/$pkg/PKGBUILD" "$aur_dir/PKGBUILD"
            cp "$GITHUB_WORKSPACE/packaging/aur/$pkg/whatevr.install" "$aur_dir/whatevr.install"
            chown -R builduser:builduser "$aur_dir"
            sudo -u builduser sh -c 'cd "$1" && makepkg --printsrcinfo > .SRCINFO' sh "$aur_dir"

            git -C "$aur_dir" config user.name 'Harsh Sharma'
            git -C "$aur_dir" config user.email 'harsh@codelif.in'
            git -C "$aur_dir" add PKGBUILD .SRCINFO whatevr.install
            if git -C "$aur_dir" diff --cached --quiet; then
              continue
            fi

            git -C "$aur_dir" commit -m "Update to $GITHUB_REF_NAME"
            git -C "$aur_dir" push origin HEAD:master
          done
