name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build (Arch)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git base-devel go cmake ninja extra-cmake-modules \
            qt6-base qt6-declarative qt6-shadertools qt6-grpc \
            kcoreaddons kdbusaddons ki18n kirigami kirigami-addons prison rlottie sqlite
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags needed for `make version`
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build
        run: make build
      - name: Show resolved version
        run: make version

  validate:
    name: Validate metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validators
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils appstream
      - name: Validate desktop entry + metainfo
        run: make validate
